spring:
  application:
    name: stocksense-api
  jpa:
    hibernate:
      ddl-auto: validate       # Hibernate validates schema; Flyway owns DDL.
    open-in-view: false        # Disable Open Session in View anti-pattern.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Actuator: expose only the health endpoint.
# Docker Compose healthchecks hit /actuator/health; frontend NEVER calls this directly.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger UI paths.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
